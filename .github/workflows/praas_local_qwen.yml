name: praas-local-qwen35-9b

on:
  pull_request:
    types: [labeled]

# The shared workflow requests a fixed permission set for every model. A caller
# must grant that full set even though this local-model job does not request an OIDC token.
permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.label.name == 'praas-local-qwen35-9b' && github.event.sender.type != 'Bot'
    name: Review with praas (Local Qwen3.5 9B)
    uses: ./.github/workflows/_praas-review.yml
    secrets: inherit
    with:
      model: openai/qwen/qwen3.5-9b

name: praas-local-gemma4-12b

on:
  pull_request:
    types: [labeled]

# The shared workflow requests a fixed permission set for every model. A caller
# must grant that full set even though this local-model job does not request an OIDC token.
permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.label.name == 'praas-local-gemma4-12b' && github.event.sender.type != 'Bot'
    name: Review with praas (Local Gemma 4 12B)
    uses: ./.github/workflows/_praas-review.yml
    secrets: inherit
    with:
      model: openai/google/gemma-4-12b

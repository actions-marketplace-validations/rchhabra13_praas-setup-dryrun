name: praas-all

on:
  pull_request:
    types: [labeled]

# A reusable workflow can only retain permissions granted by its caller. These
# grants cover OIDC for Bedrock jobs and publishing the review result.
permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.label.name == 'praas-all' && github.event.sender.type != 'Bot'
    name: Review (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gemini
            model: gemini/gemini-2.5-flash
          - name: bedrock-nova
            model: bedrock/us.amazon.nova-pro-v1:0
          - name: bedrock-qwen
            model: bedrock/qwen.qwen3-coder-next
          - name: bedrock-kimi
            model: bedrock/moonshotai.kimi-k2.5
          - name: bedrock-deepseek
            model: bedrock/deepseek.v3.2
    uses: ./.github/workflows/_praas-review.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}

  # Local models run sequentially (max-parallel: 1) so LM Studio is not hit
  # with concurrent requests that would fail or queue-starve each other.
  review-local:
    if: github.event.label.name == 'praas-all' && github.event.sender.type != 'Bot'
    name: Review (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: local-gemma4-12b
            model: openai/google/gemma-4-12b
          - name: local-qwen35-9b
            model: openai/qwen/qwen3.5-9b
    uses: ./.github/workflows/_praas-review.yml
    secrets: inherit
    with:
      model: ${{ matrix.model }}

  # Runs after all review jobs (cloud + local) and posts a score range summary.
  # Uses always() so it runs even if some reviewers fail or are skipped.
  summarize:
    needs: [review, review-local]
    if: always() && github.event.label.name == 'praas-all' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post score summary
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            // Each praas review comment carries a model line, a self-reported Score row
            // (GFM: <strong>Score</strong>: 89 / non-GFM: ### 🏅 Score: 89), and one
            // severity badge per rendered finding (🔴 Critical / 🟠 High / 🟡 Medium /
            // ⚪ Low — emitted once per issue; the critical-findings banner repeats no
            // badges, so counting occurrences counts findings exactly).
            const countAll = (body, re) => (body.match(re) || []).length;
            // Keyed by model so a re-run of praas-all counts only the latest review
            // per model (comments paginate oldest-first; later entries overwrite).
            const byModel = new Map();
            for (const comment of comments) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              const body = comment.body || '';
              const modelMatch = body.match(/🧠 \*\*Model:\*\* `([^`]+)`/);
              if (!modelMatch) continue;
              const scoreMatch =
                body.match(/<strong>Score<\/strong>:\s*(\d+)/) ||
                body.match(/### 🏅 Score:\s*(\d+)/);
              if (!scoreMatch) continue;
              const counts = {
                critical: countAll(body, /🔴 Critical/g),
                high: countAll(body, /🟠 High/g),
                medium: countAll(body, /🟡 Medium/g),
                low: countAll(body, /⚪ Low/g),
              };
              const selfScore = parseInt(scoreMatch[1], 10);
              // Evidence score: derived deterministically from the findings the model
              // itself listed. Small local models often self-report 90 while listing
              // three criticals; this anchors the number to the evidence.
              const evidenceScore = Math.max(0, Math.min(100,
                100 - 25 * counts.critical - 12 * counts.high - 6 * counts.medium - 2 * counts.low));
              const gap = Math.abs(selfScore - evidenceScore);
              byModel.set(modelMatch[1], {
                model: modelMatch[1],
                selfScore,
                evidenceScore,
                gap,
                counts,
                // Blend self-report with evidence so one badly calibrated number
                // cannot dominate; the gap is reported as a calibration signal.
                blended: Math.round((selfScore + evidenceScore) / 2),
              });
            }
            const reviews = [...byModel.values()];

            if (reviews.length < 2) {
              console.log(`Found ${reviews.length} review(s) — need at least 2 for a summary.`);
              return;
            }

            const blended = reviews.map(r => r.blended);
            const min = Math.min(...blended);
            const max = Math.max(...blended);
            const spread = max - min;
            // Weight each model by calibration: a model whose self-score contradicts
            // its own findings gets less say in the final number.
            const weights = reviews.map(r => 1 / (1 + r.gap / 10));
            const weightSum = weights.reduce((a, b) => a + b, 0);
            const finalScore = Math.round(
              reviews.reduce((acc, r, i) => acc + r.blended * weights[i], 0) / weightSum);

            // Confidence from three independent signals, 0–5 points total:
            // score agreement, agreement on serious-finding counts, and calibration.
            const serious = reviews.map(r => r.counts.critical + r.counts.high);
            const seriousSpread = Math.max(...serious) - Math.min(...serious);
            const avgGap = reviews.reduce((a, r) => a + r.gap, 0) / reviews.length;
            let points = 0;
            points += spread <= 10 ? 2 : spread <= 20 ? 1 : 0;
            points += seriousSpread === 0 ? 2 : seriousSpread <= 1 ? 1 : 0;
            points += avgGap <= 10 ? 1 : 0;
            const confidence =
              points >= 4 ? '🟢 High — scores, findings, and calibration all agree'
              : points >= 2 ? '🟡 Moderate — partial agreement, skim the individual reviews'
              : '🔴 Low — models disagree on scores or serious findings; read the reviews';

            const fmtCounts = c =>
              `${c.critical}🔴 ${c.high}🟠 ${c.medium}🟡 ${c.low}⚪`;
            const rows = [...reviews]
              .sort((a, b) => b.blended - a.blended)
              .map(r => `| \`${r.model}\` | ${r.selfScore} | ${r.evidenceScore} | **${r.blended}** | ${fmtCounts(r.counts)} |`)
              .join('\n');

            const body = [
              `## 📊 praas-all — Final Score Summary`,
              ``,
              `| Metric | Value |`,
              `|---|---|`,
              `| **Final score** | **${finalScore}** / 100 (calibration-weighted) |`,
              `| Score range | ${min} – ${max} / 100 |`,
              `| Confidence | ${confidence} (${points}/5) |`,
              `| Models reviewed | ${reviews.length} |`,
              ``,
              `<details><summary>Per-model breakdown</summary>`,
              ``,
              `| Model | Self | Evidence | Blended | Findings |`,
              `|---|---|---|---|---|`,
              rows,
              ``,
              `**Self** = score the model reported. **Evidence** = 100 minus severity-weighted`,
              `penalties for the findings it listed (25/12/6/2 per 🔴/🟠/🟡/⚪). A large gap between`,
              `the two means the model's number contradicts its own findings, and its weight in the`,
              `final score is reduced accordingly.`,
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
